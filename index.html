<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>專案排程追蹤</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <header class="dash-header">
      <div>
        <h1>專案排程追蹤</h1>
        <p class="desc">選擇一個專案查看排程，或建立新專案</p>
      </div>
      <button class="btn-secondary" id="token-btn">🔑 GitHub Token</button>
    </header>

    <div id="reminders-slot"></div>

    <div class="project-list" id="project-list"></div>

    <button class="btn-primary" id="new-project-btn">+ 新增專案</button>

    <footer>
      資料存放在 <code>projects/</code> 資料夾 ・ 需要 GitHub Token 才能新增/編輯
    </footer>
  </div>

  <script src="config.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
