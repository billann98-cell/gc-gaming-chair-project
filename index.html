<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GC Gaming Chair Project - 排程追蹤</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1 id="project-name">專案名稱</h1>
      <p class="desc" id="project-desc">專案說明</p>
    </header>

    <div class="gantt-scroll">
      <div class="gantt">
        <div class="gantt-corner"></div>
        <div class="gantt-head">
          <div class="marker-row" id="marker-row"></div>
          <div class="period-row" id="period-row"></div>
        </div>
        <div class="gantt-body" id="gantt-body"></div>
        <div class="marker-lines" id="marker-lines"></div>
      </div>
    </div>

    <div class="legend">
      <div class="legend-item"><span class="legend-swatch done"></span>已完成</div>
      <div class="legend-item"><span class="legend-swatch in-progress"></span>進行中</div>
      <div class="legend-item"><span class="legend-swatch upcoming"></span>待辦</div>
    </div>

    <footer>
      資料來源：<code>data.json</code> ・ 編輯後推送到 GitHub 即可更新此頁面
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
