<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>專案排程</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <header class="dash-header">
      <div class="header-main">
        <p class="back-link no-print"><a href="index.html">← 所有專案</a></p>
        <h1 id="project-name">專案名稱</h1>
        <p class="desc" id="project-desc">專案說明</p>
        <div class="project-progress" id="project-progress"></div>
      </div>
      <div class="header-actions no-print">
        <div class="scale-toggle" id="scale-toggle" role="group" aria-label="時間軸刻度">
          <button type="button" data-scale="week">週</button>
          <button type="button" data-scale="month">月</button>
        </div>
        <button class="btn-secondary" id="tpl-download-btn" title="下載 Excel 範本，照著填寫後可直接匯入">📥 範本</button>
        <button class="btn-secondary" id="tpl-upload-btn" title="上傳填好的 Excel 範本，產出專案排程">📤 匯入 Excel</button>
        <input type="file" id="tpl-file-input" accept=".xlsx,.csv,.tsv,.txt" style="display:none;" />
        <button class="btn-secondary" id="baseline-view-btn" title="顯示或隱藏基準線對比">📏 基準線</button>
        <button class="btn-secondary" id="print-btn" title="列印或另存 PDF">🖨️ 列印</button>
        <button class="btn-secondary" id="edit-toggle-btn">✏️ 編輯</button>
        <button class="btn-primary" id="save-btn" style="display:none;">儲存到 GitHub</button>
      </div>
    </header>

    <div class="banner-slot no-print" id="banner-slot"></div>

    <div class="gantt-scroll" id="gantt-scroll">
      <div class="gantt">
        <div class="gantt-corner"><span id="range-label"></span></div>
        <div class="gantt-head">
          <div class="marker-row" id="marker-row"></div>
          <div class="scale-groups" id="scale-groups"></div>
          <div class="scale-cols" id="scale-cols"></div>
        </div>
        <div class="gantt-body" id="gantt-body"></div>
        <div class="marker-lines" id="marker-lines"></div>
      </div>
    </div>

    <div class="legend">
      <div class="legend-item"><span class="legend-swatch done"></span>已完成</div>
      <div class="legend-item"><span class="legend-swatch in-progress"></span>進行中</div>
      <div class="legend-item"><span class="legend-swatch upcoming"></span>待辦</div>
      <div class="legend-item"><span class="legend-swatch today"></span>今天</div>
      <div class="legend-item legend-baseline" style="display:none;"><span class="legend-swatch baseline"></span>基準線</div>
      <div class="legend-note" id="today-note"></div>
    </div>

    <div class="edit-panel no-print" id="edit-panel" style="display:none;"></div>

    <footer>
      <div>資料來源：<code id="project-file-path"></code></div>
      <div class="last-updated" id="last-updated"></div>
    </footer>
  </div>

  <!-- 從 Excel 貼上匯入 -->
  <div class="modal-overlay no-print" id="import-modal" style="display:none;">
    <div class="modal">
      <div class="modal-head">
        <h3>從 Excel 貼上匯入任務</h3>
        <button class="btn-icon" id="import-close">✕</button>
      </div>
      <div class="modal-body">
        <p class="modal-hint">
          在 Excel 選取範圍後複製，直接貼到下面。第一列可以是標題列，欄位順序：
          <code>軌道　任務名稱　開始日期　結束日期　狀態　負責人　備註</code><br />
          日期可用 <code>2026-06-15</code> 或 <code>2026/6/15</code>；狀態可填「待辦 / 進行中 / 已完成」，負責人與備註可留空。
        </p>
        <textarea id="import-textarea" rows="8" placeholder="產品&#9;DFM&#9;2026-06-15&#9;2026-07-03&#9;待辦&#9;王小明&#9;含結構件"></textarea>
        <div class="import-preview" id="import-preview"></div>
      </div>
      <div class="modal-foot">
        <button class="btn-secondary" id="import-cancel">取消</button>
        <button class="btn-primary" id="import-confirm" disabled>確認匯入</button>
      </div>
    </div>
  </div>

  <!-- 上傳 Excel 範本的預覽 -->
  <div class="modal-overlay no-print" id="upload-modal" style="display:none;">
    <div class="modal">
      <div class="modal-head">
        <h3>匯入 Excel 範本</h3>
        <button class="btn-icon" id="upload-close">✕</button>
      </div>
      <div class="modal-body">
        <div class="upload-file" id="upload-file"></div>
        <div class="upload-summary" id="upload-summary"></div>
        <fieldset class="upload-mode">
          <legend>任務要怎麼帶入？</legend>
          <label class="radio-line">
            <input type="radio" name="upload-mode" value="append" checked />
            <span><strong>新增到現有排程</strong>　保留目前的任務，把檔案裡的任務加進去</span>
          </label>
          <label class="radio-line">
            <input type="radio" name="upload-mode" value="replace" />
            <span><strong>取代整個排程</strong>　清掉目前所有任務，只留檔案裡的內容</span>
          </label>
        </fieldset>
        <div class="upload-preview" id="upload-preview"></div>
      </div>
      <div class="modal-foot">
        <button class="btn-secondary" id="upload-cancel">取消</button>
        <button class="btn-primary" id="upload-confirm" disabled>確認匯入</button>
      </div>
    </div>
  </div>

  <script src="utils.js"></script>
  <script src="xlsx.js"></script>
  <script src="config.js"></script>
  <script src="templates.js"></script>
  <script src="project.js"></script>
</body>
</html>
